<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-New Beefy Nachos (₱75) — Macleen's Food House</title>
  <style>
    :root { --hk-pink: #ff69b4; --hk-dark: #831843; --hk-bg: #fff0f5; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--hk-bg); color: #1e293b; padding: 1.5rem; display: flex; justify-content: center; }
    .promo-card { max-width: 480px; width: 100%; background: white; border-radius: 20px; border: 2px dashed #f59e0b; padding: 1.5rem; text-align: center; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.15); }
    .badge { display: inline-block; background: #d97706; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
    .title { color: #92400e; font-size: 1.45rem; font-weight: 900; line-height: 1.25; margin-bottom: 8px; }
    .price-tag { font-size: 2.2rem; font-weight: 900; color: #d97706; margin-bottom: 12px; }
    .desc { font-size: 0.85rem; color: #475569; line-height: 1.4; margin-bottom: 16px; }
    .btn { display: block; width: 100%; background: #d97706; color: white; padding: 12px; border-radius: 10px; font-size: 0.95rem; font-weight: 900; text-decoration: none; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="promo-card">
    <span class="badge">🔥 3-Day Limited Drop</span>
    <h1 class="title">🧀 All-New Loaded Beefy Nachos Supreme!</h1>
    <div class="price-tag">₱75.00</div>
    <p class="desc">
      Crisp, golden tortilla chips piled high with savory seasoned ground beef, warm melted cheese sauce, and fresh toppings. Exclusive member price for 3 days only!
    </p>
    <a href="/portal/login" class="btn">⚡ Log In / Register to Reserve Deal</a>
    <a href="/" style="display:inline-block; margin-top:12px; font-size:0.8rem; color:#64748b; text-decoration:none; font-weight:bold;">← Back to Main Menu</a>
  </div>
</body>
</html>
