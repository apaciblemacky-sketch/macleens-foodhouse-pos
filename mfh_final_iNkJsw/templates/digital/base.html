<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Macleen's Digital{% endblock %}</title><style>body{font-family:Arial;margin:0;background:#ecfeff;color:#164e63}header{background:#155e75;color:white;padding:16px}.wrap{max-width:1100px;margin:auto;padding:18px}.nav{color:white;margin-right:14px}.card{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px #0e749020}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.btn{display:inline-block;background:#0891b2;color:white;padding:9px 14px;border:0;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;margin:4px 0 10px;border:1px solid #a5f3fc;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}.muted{color:#64748b;font-size:.88rem}.badge{padding:3px 7px;border-radius:10px;background:#cffafe}</style></head><body><header><strong>💻 Macleen's Digital Business</strong><span style="float:right"><a class="nav" href="{{ url_for('digital_store') }}">Catalog</a><a class="nav" href="{{ url_for('store_catalog') }}">Food House</a></span></header><main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="card">{{ m }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
