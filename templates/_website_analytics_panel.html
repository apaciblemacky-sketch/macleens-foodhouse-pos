{% set _analytics_portal = analytics_portal|default('ALL') %}
<section class="mcl-analytics" data-mcl-analytics data-portal="{{ _analytics_portal }}" data-initial='{{ website_view_analytics|tojson }}' data-csrf="{{ staff_csrf_token() }}">
  <div class="mcl-analytics__head"><div><h3>📊 Visits & Unique Visitors</h3><p>Interactive traffic history. Hover/tap the graph for daily details, change the period, or request an AI suggestion based only on aggregate analytics.</p></div><div class="mcl-analytics__controls"><select data-analytics-days aria-label="Analytics period"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">365 days</option></select><select data-analytics-metric aria-label="Analytics metric"><option value="visits">Visits</option><option value="unique">Unique visitors</option></select><button class="primary" type="button" data-analytics-ai>✨ AI suggestion</button></div></div>
  {% if _analytics_portal == 'ALL' %}<div class="mcl-analytics__portal-toggles"><label><input type="checkbox" value="STOREFRONT" checked> Storefront</label><label><input type="checkbox" value="CRAFT" checked> Crafts</label><label><input type="checkbox" value="DIGITAL" checked> Digital</label></div>{% endif %}
  <div class="mcl-analytics__summary" data-analytics-summary></div>
  <div class="mcl-analytics__chart"><canvas data-analytics-canvas></canvas><div class="mcl-analytics__tooltip" data-analytics-tooltip></div></div>
  <div class="mcl-analytics__ai" data-analytics-ai-output></div><div class="mcl-analytics__note" data-analytics-note></div>
</section>
<script>
(()=>{
  const root=document.currentScript.previousElementSibling;if(!root||!root.matches('[data-mcl-analytics]'))return;
  const canvas=root.querySelector('[data-analytics-canvas]'),ctx=canvas.getContext('2d'),tip=root.querySelector('[data-analytics-tooltip]'),summary=root.querySelector('[data-analytics-summary]'),note=root.querySelector('[data-analytics-note]'),aiOut=root.querySelector('[data-analytics-ai-output]'),daysSel=root.querySelector('[data-analytics-days]'),metricSel=root.querySelector('[data-analytics-metric]'),portal=root.dataset.portal||'ALL';
  let data={};try{data=JSON.parse(root.dataset.initial||'{}')}catch(e){};
  const labels={STOREFRONT:'Storefront',CRAFT:'Crafts',DIGITAL:'Digital'}, strokes={STOREFRONT:'#ec4899',CRAFT:'#9333ea',DIGITAL:'#0f766e'};
  const active=()=>portal==='ALL'?[...root.querySelectorAll('.mcl-analytics__portal-toggles input:checked')].map(x=>x.value):[portal];
  function resize(){const r=canvas.parentElement.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);return {w:r.width,h:r.height}}
  function draw(){const {w,h}=resize(),metric=metricSel.value,ports=active(),series=ports.map(k=>({k,vals:((data.portals||{})[k]||{})[metric]||[]})),n=(data.labels||[]).length,max=Math.max(1,...series.flatMap(s=>s.vals));ctx.clearRect(0,0,w,h);const L=38,R=12,T=16,B=32,pw=w-L-R,ph=h-T-B;ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;ctx.font='10px sans-serif';ctx.fillStyle='#64748b';for(let j=0;j<=4;j++){const y=T+ph*j/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillText(Math.round(max*(1-j/4)).toString(),4,y+3)}series.forEach(s=>{ctx.strokeStyle=strokes[s.k];ctx.lineWidth=2;ctx.beginPath();s.vals.forEach((v,i)=>{const x=L+(n<=1?0:pw*i/(n-1)),y=T+ph*(1-v/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});if(n){const step=Math.max(1,Math.ceil(n/6));(data.labels||[]).forEach((lab,i)=>{if(i%step&&i!==n-1)return;const x=L+(n<=1?0:pw*i/(n-1));ctx.fillStyle='#64748b';ctx.fillText(lab,x-13,h-10)})}canvas._chart={L,R,T,B,pw,ph,n,max,series,w,h};renderSummary()}
  function renderSummary(){const ports=active();summary.innerHTML=ports.map(k=>{const s=((data.portals||{})[k]||{}).summary||{};return `<div class="mcl-analytics__metric"><small>${labels[k]}</small><strong>${Number(s.visits||0).toLocaleString()} visits</strong><span style="font-size:.65rem;color:#64748b">${Number(s.unique_daily_sum||0).toLocaleString()} daily uniques · ${Number(s.trend_percent||0).toFixed(1)}% trend</span></div>`}).join('');note.textContent=data.unique_history_note||''}
  function pointer(ev){const ch=canvas._chart;if(!ch||!ch.n)return;const r=canvas.getBoundingClientRect(),cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left,idx=Math.max(0,Math.min(ch.n-1,Math.round((cx-ch.L)/Math.max(1,ch.pw)*(ch.n-1))));const rows=ch.series.map(s=>`${labels[s.k]}: ${Number(s.vals[idx]||0).toLocaleString()}`).join('<br>');tip.innerHTML=`<strong>${(data.dates||[])[idx]||''}</strong><br>${rows}`;tip.style.display='block';tip.style.left=Math.min(ch.w-145,Math.max(5,cx+8))+'px';tip.style.top='12px'}
  canvas.addEventListener('mousemove',pointer);canvas.addEventListener('touchstart',pointer,{passive:true});canvas.addEventListener('mouseleave',()=>tip.style.display='none');
  async function load(){daysSel.disabled=true;try{const res=await fetch(`/admin/api/website-analytics?days=${encodeURIComponent(daysSel.value)}&portal=${encodeURIComponent(portal)}`,{headers:{'Accept':'application/json'}});if(!res.ok)throw new Error('Analytics could not be loaded.');data=await res.json();draw()}catch(e){note.textContent=e.message}finally{daysSel.disabled=false}}
  daysSel.addEventListener('change',load);metricSel.addEventListener('change',draw);root.querySelectorAll('.mcl-analytics__portal-toggles input').forEach(x=>x.addEventListener('change',draw));window.addEventListener('resize',()=>requestAnimationFrame(draw));
  root.querySelector('[data-analytics-ai]').addEventListener('click',async e=>{e.currentTarget.disabled=true;aiOut.classList.add('show');aiOut.textContent='Analyzing aggregate traffic…';try{const res=await fetch('/admin/api/website-analytics/ai-suggestion',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':root.dataset.csrf||''},body:JSON.stringify({days:daysSel.value,portal})});const body=await res.json();if(!res.ok||!body.success)throw new Error(body.error||'AI suggestion unavailable.');aiOut.textContent=body.suggestion||'No suggestion returned.'}catch(err){aiOut.textContent=err.message}finally{e.currentTarget.disabled=false}});
  draw();
})();
</script>
