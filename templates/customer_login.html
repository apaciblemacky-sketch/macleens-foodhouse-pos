<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macleen's Rewards Login</title>
  <style>
    *{box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} body{background:radial-gradient(circle at 85% 10%,#ccfbf1,transparent 27%),linear-gradient(145deg,#fff1f7,#f0fdfa);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}.card{background:rgba(255,255,255,.96);padding:2rem;border-radius:24px;border:1px solid #e2e8f0;width:100%;max-width:410px;box-shadow:0 22px 55px rgba(15,23,42,.12)} input{width:100%;padding:.82rem;margin:.3rem 0 1rem;border:1px solid #dbe7e4;border-radius:11px}input:focus{outline:0;border-color:#0f766e;box-shadow:0 0 0 4px rgba(15,118,110,.1)}.btn{width:100%;padding:.85rem;background:linear-gradient(135deg,#ec4899,#db2777);color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer}a{color:#0f766e;text-decoration:none;font-size:.85rem;font-weight:800}.perk{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.perk div{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:11px;padding:9px;text-align:center;font-size:.7rem;color:#115e59;font-weight:850}
  </style>
</head>
<body><div class="card">
  <h2 style="color:#831843;text-align:center;">🎁 Macleen's Rewards</h2>
  <p style="text-align:center;color:#6b7280;font-size:.82rem;margin-top:5px;">For walk-in customers too — no online order required.</p>
  <div class="perk"><div>⭐ Earn Points</div><div>🔖 Save Favorites</div><div>👥 Barkada Orders</div><div>🔥 Member Deals</div></div>
  {% with msgs=get_flashed_messages() %}{% if msgs %}<div style="background:#fee2e2;color:#991b1b;padding:8px;border-radius:7px;font-size:.78rem;margin-bottom:8px;">{{ msgs[0] }}</div>{% endif %}{% endwith %}
  <form method="POST">
    <input type="hidden" name="next" value="{{ next_section or '' }}">
    <label style="font-size:.8rem;font-weight:800;">Mobile Number or Card ID</label>
    <input type="text" name="contact" value="{{ card_hint or '' }}" placeholder="09xxxxxxxxx or MFH-0001" required>
    <label style="font-size:.8rem;font-weight:800;">4-Digit PIN</label>
    <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="4 digits" required>
    <button class="btn" type="submit">Open My Benefits</button>
  </form>
  <div style="text-align:center;margin-top:1rem;"><a href="/portal/register{% if source and source != 'direct' %}?src={{ source }}{% if next_section %}&next={{ next_section }}{% endif %}{% endif %}">New member? Join in about 20 seconds</a></div>
  <div style="text-align:center;margin-top:.7rem;"><a href="/" style="color:#64748b;">← Back to Menu</a></div>
</div></body></html>
