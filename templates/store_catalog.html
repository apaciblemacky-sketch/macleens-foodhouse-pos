<script>
  let cart = JSON.parse(localStorage.getItem('mfh_cart') || '{}');

  function saveCart() {
    localStorage.setItem('mfh_cart', JSON.stringify(cart));
  }

  function showCategory(cat, btn) {
    document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.product-card').forEach(p => {
      p.style.display = (cat === 'ALL' || p.dataset.cat === cat) ? 'flex' : 'none';
    });
  }

  function addToCart(id, name, price) {
    id = String(id);
    if (cart[id]) {
      cart[id].qty += 1;
    } else {
      cart[id] = { name: name, price: parseFloat(price), qty: 1 };
    }
    saveCart();
    renderCart();
  }

  function updateQty(id, delta) {
    id = String(id);
    if (cart[id]) {
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
    }
    saveCart();
    renderCart();
  }

  function openDrawer() { 
    renderCart();
    document.getElementById('drawerWrap').className = 'drawer-open'; 
  }
  function closeDrawer() { document.getElementById('drawerWrap').className = ''; }

  function checkPayMethod() {
    const p = document.getElementById('payMethod').value;
    document.getElementById('evalFields').style.display = (p === 'GCASH' || p === 'CREDIT') ? 'block' : 'none';
    document.getElementById('gcashFields').style.display = (p === 'GCASH') ? 'block' : 'none';
  }

  function renderCart() {
    const container = document.getElementById('cartItemsList');
    const barTotalEl = document.getElementById('barTotal');
    const barCountEl = document.getElementById('barCount');
    const drawerTotalEl = document.getElementById('drawerTotal');
    
    const keys = Object.keys(cart);
    const orderTypeSelect = document.getElementById('orderType');
    const isDelivery = orderTypeSelect ? (orderTypeSelect.value === 'DELIVERY') : false;
    
    const zoneBox = document.getElementById('deliveryZoneBox');
    const delFields = document.getElementById('deliveryFields');
    if (zoneBox) zoneBox.style.display = isDelivery ? 'block' : 'none';
    if (delFields) delFields.style.display = isDelivery ? 'block' : 'none';

    if (keys.length === 0) {
      if (container) container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:15px;">Your basket is empty.</p>';
      if (barTotalEl) barTotalEl.innerText = '₱0.00';
      if (barCountEl) barCountEl.innerText = '0';
      if (drawerTotalEl) drawerTotalEl.innerText = '₱0.00';
      return;
    }

    let html = '';
    let subtotal = 0;
    let count = 0;
    
    keys.forEach(id => {
      const item = cart[id];
      const row = item.price * item.qty;
      subtotal += row;
      count += item.qty;
      html += `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #fbcfe8;">
          <div>
            <strong style="font-size:0.85rem;">${item.name}</strong>
            <div style="font-size:0.75rem; color:#64748b;">₱${item.price.toFixed(2)} ea</div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button onclick="updateQty('${id}', -1)" style="padding:2px 8px; border:1px solid #cbd5e1; border-radius:4px; background:white; font-weight:bold;">-</button>
            <strong>${item.qty}</strong>
            <button onclick="updateQty('${id}', 1)" style="padding:2px 8px; border:1px solid #cbd5e1; border-radius:4px; background:white; font-weight:bold;">+</button>
            <span style="font-weight:900; width:60px; text-align:right;">₱${row.toFixed(2)}</span>
          </div>
        </div>
      `;
    });

    let deliveryFee = 0.0;
    if (isDelivery) {
      const zSelect = document.getElementById('deliveryZone');
      if (zSelect && zSelect.selectedOptions && zSelect.selectedOptions[0]) {
        deliveryFee = parseFloat(zSelect.selectedOptions[0].dataset.rate || 40.0);
      } else {
        deliveryFee = 40.0;
      }
      html += `<div style="display:flex; justify-content:space-between; padding:8px 0; color:#831843; font-weight:bold;">
        <span>Barangay Delivery Fee</span>
        <span>₱${deliveryFee.toFixed(2)}</span>
      </div>`;
    }

    const total = subtotal + deliveryFee;
    if (container) container.innerHTML = html;
    if (barTotalEl) barTotalEl.innerText = `₱${total.toFixed(2)}`;
    if (barCountEl) barCountEl.innerText = count;
    if (drawerTotalEl) drawerTotalEl.innerText = `₱${total.toFixed(2)}`;
  }

  async function toggleLike(id) {
    const res = await fetch(`/api/toggle-like/${id}`, { method: 'POST' });
    const data = await res.json();
    document.getElementById(`like-${id}`).innerText = data.total_likes;
    const btn = document.getElementById(`like-btn-${id}`);
    if (data.liked) btn.classList.add('liked');
    else btn.classList.remove('liked');
  }

  async function submitOrder() {
    {% if not cust %}
      alert("Please log in or register before placing an order.");
      window.location.href = "/portal/login";
      return;
    {% endif %}

    const keys = Object.keys(cart);
    if (keys.length === 0) return alert("Cart is empty.");

    const targetTime = document.getElementById('targetTime').value.trim();
    const notes = document.getElementById('orderNotes').value.trim();
    const orderType = document.getElementById('orderType').value;
    const pay = document.getElementById('payMethod').value;
    const fb = document.getElementById('fbMessenger').value.trim();
    const gcash = document.getElementById('gcashRef').value.trim();
    const landmark = document.getElementById('landmark').value.trim();
    const deliveryAddress = document.getElementById('deliveryAddress').value.trim();

    if (!targetTime || !notes) return alert("Please fill in target time and notes.");
    if (orderType === 'DELIVERY' && (!landmark || !deliveryAddress)) {
      return alert("Landmark and Delivery address are strictly required for delivery.");
    }
    if ((pay === 'GCASH' || pay === 'CREDIT') && !fb) return alert("Facebook profile link required for evaluation.");
    if (pay === 'GCASH' && gcash.length < 6) return alert("Please input the 6-digit GCash Reference Number.");

    const payload = {
      items: keys.map(id => ({ product_id: parseInt(id), quantity: cart[id].qty })),
      order_type: orderType,
      delivery_zone_id: orderType === 'DELIVERY' ? document.getElementById('deliveryZone').value : null,
      target_time: targetTime,
      fb_messenger: fb,
      payment_method: pay,
      gcash_ref: gcash,
      notes: notes,
      delivery_address: deliveryAddress,
      landmark: landmark
    };

    const res = await fetch('/api/storefront-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      alert(`🎉 Order #${data.order_id} placed! Total: ₱${data.total.toFixed(2)}`);
      cart = {};
      saveCart();
      renderCart();
      closeDrawer();
      window.location.href = "/portal/dashboard";
    } else {
      alert(data.message);
    }
  }

  // Initial cart load
  document.addEventListener("DOMContentLoaded", () => {
    renderCart();
  });
</script>
