{% extends 'base.html' %}
{% block content %}
  <p style="margin-bottom: 1.5rem;"><a href="/admin" style="color: #2d5a27; font-weight: 600; text-decoration: none;">← Back to Owner Admin</a></p>

  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; max-width: 450px; margin: 1rem auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
    <h2 style="color: #1a202c; margin-bottom: 0.5rem;">🔑 Change Admin Password</h2>
    <p style="color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">Update the password used to access your store manager.</p>

    {% if message %}
      <div style="background: #dcfce7; color: #166534; padding: 0.75rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem;">
        {{ message }}
      </div>
    {% endif %}

    {% if error %}
      <div style="background: #fee2e2; color: #dc2626; padding: 0.75rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem;">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST">
      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Current Password</label>
      <input type="password" name="current_password" required placeholder="Enter current password" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">New Password</label>
      <input type="password" name="new_password" required placeholder="Enter new password" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <label style="display:block; margin-top: 1rem; font-weight: 600; color: #2d3748;">Confirm New Password</label>
      <input type="password" name="confirm_password" required placeholder="Re-type new password" style="width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;">

      <button class="btn" type="submit" style="margin-top: 1.5rem;">Update Password</button>
    </form>
  </div>
{% endblock %}
