<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #fff5f7; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: white; padding: 2rem; border-radius: 12px; border: 1px solid #fbcfe8; width: 100%; max-width: 380px; box-shadow: 0 4px 12px rgba(236,72,153,0.1); }
    input { width: 100%; padding: 0.75rem; margin-top: 0.3rem; margin-bottom: 1rem; border: 1px solid #fbcfe8; border-radius: 6px; }
    .btn { width: 100%; padding: 0.8rem; background: #ec4899; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color: #831843; text-align: center; margin-bottom: 1rem;">🔒 Staff PIN Access</h2>
    {% with msgs = get_flashed_messages() %}
      {% if msgs %}<p style="color: red; font-size: 0.85rem; margin-bottom: 8px;">{{ msgs[0] }}</p>{% endif %}
    {% endwith %}
    <form method="POST">
      <label>Staff Username / Station</label>
      <input type="text" name="username" placeholder="e.g. cashier1, kitchen1, admin" required>
      
      <label>Security PIN</label>
      <input type="password" name="pin" placeholder="Enter PIN" required>
      
      <button class="btn" type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
