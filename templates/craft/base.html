<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Macleen's Craft Shop{% endblock %}</title>
  <style>
    :root{--pink:#ec4899;--dark:#831843;--bg:#fff7fb;--border:#fbcfe8;--purple:#7c3aed;--green:#059669;--text:#1f2937;--muted:#64748b}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .brand{font-weight:900;color:var(--dark);font-size:1rem}.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .btn,.nav a{display:inline-block;border:0;border-radius:9px;padding:8px 12px;font-weight:800;text-decoration:none;cursor:pointer;font-size:.82rem}
    .btn-pink{background:var(--pink);color:#fff}.btn-purple{background:var(--purple);color:#fff}.btn-light{background:#f8fafc;color:#475569;border:1px solid #cbd5e1}.btn-danger{background:#fee2e2;color:#991b1b}.btn-green{background:#dcfce7;color:#166534}
    .container{max-width:1180px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 3px 12px rgba(131,24,67,.05)}
    .grid{display:grid;gap:12px}.products{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.metrics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
    .product{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.product img{width:100%;height:160px;object-fit:cover;background:#fdf2f8}.product-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.price{font-size:1.15rem;font-weight:900;color:var(--pink)}
    .badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:.7rem;font-weight:900}.stock{background:#dcfce7;color:#166534}.pre{background:#ede9fe;color:#6d28d9}.sold{background:#fee2e2;color:#991b1b}
    input,select,textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}label{font-size:.75rem;font-weight:800;color:#475569;display:block;margin-bottom:4px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}
    table{width:100%;border-collapse:collapse;font-size:.8rem}th{background:#fdf2f8;color:var(--dark);text-align:left;padding:8px;border-bottom:1px solid var(--border);position:sticky;top:0}td{padding:8px;border-bottom:1px solid #fce7f3;vertical-align:top}.table-wrap{overflow:auto;max-height:520px}
    .flash{padding:10px 12px;border-radius:8px;margin-bottom:10px;font-weight:700}.flash-success{background:#dcfce7;color:#166534}.flash-error{background:#fee2e2;color:#991b1b}.flash-info{background:#e0f2fe;color:#075985}
    .hero{background:linear-gradient(135deg,#ec4899,#7c3aed);color:#fff;padding:28px 16px;text-align:center}.hero h1{margin:0 0 5px}.muted{color:var(--muted);font-size:.82rem}
    @media(max-width:700px){header{align-items:flex-start}.container{padding:10px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.product img{height:120px}.nav a{font-size:.72rem;padding:7px 8px}}
  </style>
</head>
<body>
<header>
  <div class="brand">🎨 Macleen's Craft Shop</div>
  <div class="nav">
    <a class="btn-light" href="{{ url_for('craft_store') }}">Craft Catalog</a>
    <a class="btn-light" href="{{ url_for('store_catalog') }}">🍲 Food House</a>
  </div>
</header>
<div class="container">
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
