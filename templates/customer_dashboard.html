<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard — Macleen's</title>
  <style>
    :root { --hk-pink: #ff69b4; --hk-dark: #831843; --hk-border: #fbcfe8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #fff0f5; color: #1e293b; padding: 1rem; }

    .card { background: white; border-radius: 12px; border: 1px solid var(--hk-border); padding: 1.2rem; margin-bottom: 1rem; max-width: 600px; margin-left: auto; margin-right: auto; }
    .btn { background: var(--hk-pink); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-decoration: none; display: inline-block; text-align: center; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card" style="text-align:center;">
    <div style="margin-bottom:10px;">
      {% if cust.profile_image %}
        <img src="{{ cust.profile_image }}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--hk-pink);">
      {% else %}
        <div style="width:80px; height:80px; border-radius:50%; background:#fce7f3; display:inline-flex; justify-content:center; align-items:center; font-size:2rem;">🎀</div>
      {% endif %}
    </div>

    <h2 style="color:var(--hk-dark);">{{ cust.name }}</h2>
    <div style="font-size:0.85rem; color:#64748b;">Card #: <strong>{{ cust.card_number }}</strong></div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;">
      <div style="background:#fdf2f8; padding:10px; border-radius:8px;">
        <div style="font-size:0.75rem; color:#64748b;">REWARD POINTS</div>
        <div style="font-size:1.4rem; font-weight:900; color:var(--hk-pink);">{{ cust.points_balance|int }}</div>
      </div>
      <div style="background:#fdf2f8; padding:10px; border-radius:8px;">
        <div style="font-size:0.75rem; color:#64748b;">ACCUMULATED WI-FI</div>
        <div style="font-size:1.4rem; font-weight:900; color:#0284c7;">{{ cust.accumulated_wifi_mins or 0 }} <span style="font-size:0.8rem;">Mins</span></div>
      </div>
    </div>

    <!-- Wi-Fi Daily Claim -->
    {% if cust.last_wifi_claim == today %}
      <button class="btn" disabled>✓ Today's Free Wi-Fi Claimed (Code: {{ cust.wifi_voucher_code }})</button>
    {% else %}
      <form action="/portal/claim-wifi" method="POST">
        <button type="submit" class="btn">⚡ Claim Today's 10-Min Free Wi-Fi</button>
      </form>
    {% endif %}
  </div>

  <!-- Profile Image & PIN Update -->
  <div class="card">
    <h3 style="color:var(--hk-dark); font-size:0.95rem; margin-bottom:10px;">⚙️ Profile Settings</h3>
    <form action="/portal/update-profile-pic" method="POST" style="margin-bottom:12px;">
      <label style="font-size:0.8rem; font-weight:bold;">Profile Picture Image URL</label>
      <input type="url" name="profile_image" placeholder="https://example.com/photo.jpg" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; margin:4px 0 8px;">
      <button type="submit" class="btn" style="padding:6px;">Update Photo</button>
    </form>

    <form action="/admin/change-password" method="POST">
      <label style="font-size:0.8rem; font-weight:bold;">Update 4-Digit Security PIN</label>
      <input type="password" name="new_pin" placeholder="New PIN" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; margin:4px 0 8px;">
      <button type="submit" class="btn" style="padding:6px; background:#1e293b;">Save New PIN</button>
    </form>
  </div>

</body>
</html>
