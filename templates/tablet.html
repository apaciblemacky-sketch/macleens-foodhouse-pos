<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Macleen's Tablet Kiosk</title>
  <style>
    :root { --hk-pink: #ff69b4; --hk-dark: #831843; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: #1e293b; color: white; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
    .kiosk-grid { display: grid; grid-template-columns: 1fr 340px 220px; flex: 1; height: calc(100vh - 45px); }

    /* Left Menu */
    .menu-pane { background: #0f172a; padding: 10px; display: flex; flex-direction: column; overflow-y: auto; }
    .dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 8px; }
    .dish-tile { background: white; border: 2px solid #cbd5e1; border-radius: 6px; padding: 8px; height: 95px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
    .dish-tile:active { background: #ffebf3; border-color: var(--hk-pink); }

    /* Center Bill */
    .bill-pane { background: #1e293b; border-left: 2px solid #334155; display: flex; flex-direction: column; padding: 10px; }
    .receipt { background: white; border-radius: 6px; flex: 1; padding: 10px; overflow-y: auto; }

    /* Right On-Screen Keypad */
    .keypad-pane { background: #1e293b; border-left: 2px solid #334155; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .pad-key { background: #334155; color: white; border: 1px solid #475569; border-radius: 6px; font-size: 1.2rem; font-weight: 900; height: 50px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .pad-key:active { background: var(--hk-pink); }
  </style>
</head>
<body>

  <header>
    <strong style="color:var(--hk-pink);">🎀 MACLEEN'S TABLET TOUCH KIOSK</strong>
    <button onclick="resetTicket()" style="background:#ef4444; color:white; border:none; padding:4px 10px; border-radius:4px; font-weight:bold;">CLEAR</button>
  </header>

  <div class="kiosk-grid">
    <!-- Dish Catalog -->
    <div class="menu-pane">
      <div class="dish-grid">
        {% for p in products %}
        <div class="dish-tile" onclick="addItem({{ p.id }}, '{{ p.name }}', {{ p.price }})">
          <div style="font-size:0.8rem; font-weight:900;">{{ p.name }}</div>
          <div style="font-size:0.9rem; font-weight:900; color:var(--hk-pink);">₱{{ "{:,.2f}".format(p.price) }}</div>
        </div>
        {% endfor %}
      </div>
    </div>

    <!-- Receipt Bill -->
    <div class="bill-pane">
      <div class="receipt" id="receiptBox">
        <p style="color:#94a3b8; text-align:center; padding-top:40px;">Tap items to add.</p>
      </div>

      <div style="background:#0f172a; padding:10px; border-radius:6px; margin-top:10px; color:white;">
        <div style="display:flex; justify-content:space-between; font-weight:900; font-size:1.3rem;">
          <span>TOTAL</span>
          <span style="color:var(--hk-pink);" id="kioskTotal">₱0.00</span>
        </div>
        <button onclick="submitKiosk()" style="width:100%; background:var(--hk-pink); color:white; border:none; padding:12px; border-radius:6px; font-weight:900; margin-top:8px; font-size:1rem; cursor:pointer;">SEND TO KITCHEN</button>
      </div>
    </div>

    <!-- Keypad -->
    <div class="keypad-pane">
      <input type="text" id="keypadInput" placeholder="Enter Card / PIN" style="background:#0f172a; color:white; border:1px solid #64748b; padding:10px; border-radius:6px; text-align:center; font-weight:bold; font-size:1.1rem; margin-bottom:6px;">
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;">
        <div class="pad-key" onclick="pressKey('1')">1</div>
        <div class="pad-key" onclick="pressKey('2')">2</div>
        <div class="pad-key" onclick="pressKey('3')">3</div>
        <div class="pad-key" onclick="pressKey('4')">4</div>
        <div class="pad-key" onclick="pressKey('5')">5</div>
        <div class="pad-key" onclick="pressKey('6')">6</div>
        <div class="pad-key" onclick="pressKey('7')">7</div>
        <div class="pad-key" onclick="pressKey('8')">8</div>
        <div class="pad-key" onclick="pressKey('9')">9</div>
        <div class="pad-key" onclick="pressKey('C')" style="color:#f87171;">C</div>
        <div class="pad-key" onclick="pressKey('0')">0</div>
        <div class="pad-key" onclick="pressKey('OK')" style="color:#4ade80;">OK</div>
      </div>
    </div>
  </div>

  <script>
    let kCart = {};

    function pressKey(k) {
      const inp = document.getElementById('keypadInput');
      if (k === 'C') inp.value = '';
      else if (k === 'OK') alert("Input recorded: " + inp.value);
      else inp.value += k;
    }

    function addItem(id, name, price) {
      if (kCart[id]) kCart[id].qty += 1;
      else kCart[id] = { name, price: parseFloat(price), qty: 1 };
      renderKiosk();
    }

    function renderKiosk() {
      const r = document.getElementById('receiptBox');
      const keys = Object.keys(kCart);
      if (keys.length === 0) {
        r.innerHTML = '<p style="color:#94a3b8; text-align:center; padding-top:40px;">Tap items to add.</p>';
        document.getElementById('kioskTotal').innerText = '₱0.00';
        return;
      }

      let html = '';
      let total = 0;
      keys.forEach(id => {
        const item = kCart[id];
        const row = item.price * item.qty;
        total += row;
        html += `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #cbd5e1; font-size:0.85rem;">
          <div><strong>${item.name}</strong> x${item.qty}</div>
          <div>₱${row.toFixed(2)}</div>
        </div>`;
      });

      r.innerHTML = html;
      document.getElementById('kioskTotal').innerText = `₱${total.toFixed(2)}`;
    }

    function resetTicket() {
      kCart = {};
      renderKiosk();
    }

    async function submitKiosk() {
      const keys = Object.keys(kCart);
      if (keys.length === 0) return alert("Ticket is empty.");

      const payload = {
        items: keys.map(id => ({ product_id: parseInt(id), quantity: kCart[id].qty })),
        payment_method: 'CASH'
      };

      const res = await fetch('/api/storefront-checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...payload,
          order_type: 'TABLET',
          customer_name: 'Counter Kiosk',
          contact: '0000',
          notes: 'Tablet Self-Order'
        })
      });
      const data = await res.json();
      if (data.success) {
        alert(`Order #${data.order_id} generated! Please pay at cashier.`);
        resetTicket();
      }
    }
  </script>
</body>
</html>
