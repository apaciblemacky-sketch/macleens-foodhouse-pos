<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Macleen's Self-Order Kiosk</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#ff69b4">
  <style>
    :root { --hk-pink: #ff69b4; --hk-dark: #831843; --hk-bg: #fdf2f8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--hk-bg); color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: white; border-bottom: 3px solid var(--hk-pink); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--hk-dark); font-size: 1.2rem; }
    .brand img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--hk-pink); }

    .kiosk-body { display: grid; grid-template-columns: 1fr 380px; flex: 1; height: calc(100vh - 65px); }

    /* Left Menu */
    .menu-panel { padding: 14px; display: flex; flex-direction: column; overflow-y: auto; }
    .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .cat-btn { background: white; border: 2px solid #fbcfe8; color: var(--hk-dark); padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: var(--hk-pink); color: white; border-color: var(--hk-pink); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .item-card { background: white; border: 1.5px solid #fbcfe8; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: transform 0.1s; }
    .item-card:active { transform: scale(0.97); }
    .item-img { width: 100%; height: 95px; border-radius: 8px; object-fit: cover; margin-bottom: 6px; background: #fff0f5; }
    .item-name { font-size: 0.85rem; font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
    .item-price { font-size: 1rem; font-weight: 900; color: var(--hk-pink); }

    /* Right Tray */
    .tray-panel { background: white; border-left: 2px solid #fbcfe8; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .tray-list { flex: 1; overflow-y: auto; margin: 12px 0; border-top: 1px dashed #fbcfe8; border-bottom: 1px dashed #fbcfe8; padding: 8px 0; }
    .tray-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #fdf2f8; font-size: 0.85rem; }
    .btn-qty { width: 26px; height: 26px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-submit { background: var(--hk-pink); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1.05rem; font-weight: 900; width: 100%; cursor: pointer; }
    .form-control { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; margin-top: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="{{ store_logo }}" onerror="this.onerror=null; this.src='/static/logo.png';">
      <span>MACLEEN'S TABLET KIOSK</span>
    </div>
    <span style="font-weight:bold; font-size:0.85rem; color:#831843;">✨ Tap dish to add to tray</span>
  </header>

  <div class="kiosk-body">
    <!-- Menu Grid -->
    <div class="menu-panel">
      <div class="cat-bar">
        <button class="cat-btn active" onclick="filterCat('ALL', this)">ALL MENU</button>
        {% for c in categories %}
          <button class="cat-btn" onclick="filterCat('{{ c.name }}', this)">{{ c.name }}</button>
        {% endfor %}
      </div>

      <div class="grid">
        {% for p in products %}
        <div class="item-card" data-cat="{{ p.category_name }}" onclick="addToTray({{ p.id }}, '{{ p.name }}', {{ p.price }})">
          <div>
            {% if p.image_url %}
              <img src="{{ p.image_url }}" referrerpolicy="no-referrer" class="item-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x95?text=Food';">
            {% else %}
              <div class="item-img" style="display:flex; align-items:center; justify-content:center; font-size:2rem;">🍲</div>
            {% endif %}
            <div class="item-name">{{ p.name }}</div>
          </div>
          <div class="item-price">₱{{ "{:,.2f}".format(p.price) }}</div>
        </div>
        {% endfor %}
      </div>
    </div>

    <!-- Order Tray -->
    <div class="tray-panel">
      <div>
        <h3 style="color:var(--hk-dark); font-size:1.1rem; margin-bottom:8px;">🛒 Your Table Tray</h3>
        <div style="display:flex; gap:8px;">
          <input type="text" id="tableNum" class="form-control" placeholder="Table # (e.g. Table 3)" value="Table 1" required>
          <input type="text" id="custName" class="form-control" placeholder="Your Name" value="Guest">
        </div>
      </div>

      <div class="tray-list" id="trayContainer">
        <p style="color:#94a3b8; text-align:center; padding-top:40px;">Tray is empty. Tap any dish on the left to order.</p>
      </div>

      <div>
        <div style="margin-bottom:8px;">
          <label style="font-size:0.75rem; font-weight:bold;">Payment Method</label>
          <select id="payMethod" class="form-control">
            <option value="CASH">Pay at Cashier Counter (Cash)</option>
            <option value="GCASH">GCash to Counter</option>
          </select>
        </div>

        <div style="display:flex; justify-content:space-between; font-weight:900; font-size:1.2rem; color:var(--hk-dark); margin:10px 0;">
          <span>TOTAL</span>
          <span id="trayTotal">₱0.00</span>
        </div>

        <button class="btn-submit" onclick="submitTabletOrder()">SEND ORDER TO CASHIER</button>
      </div>
    </div>
  </div>

  <script>
    let tray = {};

    function filterCat(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.item-card').forEach(card => {
        card.style.display = (cat === 'ALL' || card.dataset.cat === cat) ? 'flex' : 'none';
      });
    }

    function addToTray(id, name, price) {
      id = String(id);
      if (tray[id]) {
        tray[id].qty += 1;
      } else {
        tray[id] = { name: name, price: parseFloat(price), qty: 1 };
      }
      renderTray();
    }

    function updateTrayQty(id, delta) {
      id = String(id);
      if (tray[id]) {
        tray[id].qty += delta;
        if (tray[id].qty <= 0) delete tray[id];
      }
      renderTray();
    }

    function renderTray() {
      const container = document.getElementById('trayContainer');
      const totalEl = document.getElementById('trayTotal');
      const keys = Object.keys(tray);

      if (keys.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding-top:40px;">Tray is empty. Tap any dish on the left to order.</p>';
        totalEl.innerText = '₱0.00';
        return;
      }

      let html = '';
      let subtotal = 0;
      keys.forEach(id => {
        const item = tray[id];
        const rowTotal = item.price * item.qty;
        subtotal += rowTotal;
        html += `
          <div class="tray-item">
            <div>
              <strong>${item.name}</strong><br>
              <span style="color:#64748b; font-size:0.75rem;">₱${item.price.toFixed(2)} ea</span>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              <button class="btn-qty" onclick="updateTrayQty('${id}', -1)">-</button>
              <strong>${item.qty}</strong>
              <button class="btn-qty" onclick="updateTrayQty('${id}', 1)">+</button>
              <span style="font-weight:900; width:55px; text-align:right;">₱${rowTotal.toFixed(2)}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      totalEl.innerText = `₱${subtotal.toFixed(2)}`;
    }

    async function submitTabletOrder() {
      const keys = Object.keys(tray);
      if (keys.length === 0) return alert("Please select at least 1 item.");

      const tableNum = document.getElementById('tableNum').value.trim() || 'Table Kiosk';
      const custName = document.getElementById('custName').value.trim() || 'Tablet Guest';
      const payMethod = document.getElementById('payMethod').value;

      const payload = {
        items: keys.map(id => ({ product_id: parseInt(id), quantity: tray[id].qty })),
        table_number: tableNum,
        customer_name: custName,
        payment_method: payMethod,
        notes: `Table Order from ${tableNum}`
      };

      try {
        const res = await fetch('/api/tablet-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert(`🎉 Order #${data.order_id} sent to Cashier!\nPlease proceed to pay or wait for your food.`);
          tray = {};
          renderTray();
        } else {
          alert(data.message || "Failed to submit order.");
        }
      } catch(e) {
        alert("Server error. Please call the cashier.");
      }
    }
  </script>
</body>
</html>
