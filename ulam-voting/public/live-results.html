<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Ulam Results — Macleen's Food House</title>
<style>
:root{--bg:#fff0f5;--pink:#ff9ebb;--rose:#d6457a;--soft:#ffd6e4;--ink:#5a2a3c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:var(--bg);padding:18px}
.wrap{max-width:850px;margin:auto}.card{background:#fff;border:3px solid var(--pink);border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 6px 0 var(--soft)}
h1,h2{margin:0 0 6px}.muted{color:#8b6170}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{padding:11px 14px;border:2px solid var(--pink);border-radius:12px;font-size:1rem}button{border:0;border-radius:99px;padding:10px 18px;font-weight:700;background:var(--rose);color:#fff;cursor:pointer}
button.ghost{background:var(--soft);color:var(--rose)}[hidden]{display:none!important}
.res{display:grid;grid-template-columns:40px 1fr 55px;gap:8px;align-items:center;margin:15px 0}.rank{font-size:1.35rem;font-weight:800;color:var(--rose)}.bar{height:16px;background:var(--soft);border-radius:99px;overflow:hidden;grid-column:2/3}.bar i{display:block;height:100%;background:var(--rose);border-radius:99px}.votes{font-weight:800;text-align:right;grid-column:3;grid-row:1/3}
.msg{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--soft)}@media(max-width:600px){.res{grid-template-columns:35px 1fr 45px}}
</style>
</head>
<body>
<div class="wrap">
<header style="text-align:center;padding:15px">
<h1>📊 Live Ulam Results</h1>
<p class="muted">Admin-only live ranking for the current Ulam Voting cycle.</p>
</header>

<section class="card" id="loginBox">
<h2>Admin verification</h2>
<p class="muted">Enter the Ulam Voting admin PIN to view live results.</p>
<div class="row" style="margin-top:12px">
<input id="pin" type="password" inputmode="numeric" maxlength="20" placeholder="Admin PIN">
<button id="login">View Live Results</button>
</div>
<div id="loginMsg" class="msg" hidden></div>
</section>

<section class="card" id="resultsBox" hidden>
<div class="row" style="justify-content:space-between">
<div><h2>Current Top 10</h2><div class="muted" id="meta"></div></div>
<button class="ghost" id="refresh">↻ Refresh</button>
</div>
<div id="results" style="margin-top:15px"></div>
<h2 style="margin-top:28px">👥 Members Who Voted</h2>
<div class="muted" id="voterMeta"></div>
<div id="voters" style="margin-top:12px"></div>
<div class="muted" style="margin-top:12px">Results refresh automatically every second while this page is open.</div>
</section>
</div>
<script>
let adminToken=sessionStorage.getItem('ulam_admin_token')||'';
const $=id=>document.getElementById(id);
async function api(path,opt){
  opt=opt||{};const headers={'Content-Type':'application/json'};
  if(adminToken)headers.Authorization='Bearer '+adminToken;
  const r=await fetch(path,{method:opt.method||'GET',headers,body:opt.body});
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error(j.error||'Request failed.');
  return j;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showMsg(t){$('loginMsg').textContent=t;$('loginMsg').hidden=false}
async function loadResults(){
  try{
    const j=await api('/ulam-voting/api/results');
    const rows=j.ranking||[],max=Math.max(1,...rows.map(x=>Number(x.n)||0));
    $('meta').textContent=j.voters+' member(s) voted · cycle '+j.cycle_date;
    $('results').innerHTML=rows.length?rows.map((x,i)=>'<div class="res"><span class="rank">#'+(i+1)+'</span><span><b>'+esc(x.name)+'</b></span><span class="votes">'+x.n+'</span><span></span><div class="bar"><i style="width:'+((Number(x.n)||0)/max*100)+'%"></i></div></div>').join(''):'<p class="muted">No votes yet for this cycle.</p>';
    const voterData=await api('/ulam-voting/api/admin/voters');
    const voters=voterData.voters||[];
    $('voterMeta').textContent=voters.length+' member(s) · cycle '+voterData.cycle_date;
    $('voters').innerHTML=voters.length?voters.map((x,i)=>'<div class="msg"><b>#'+(i+1)+'</b> '+esc(x.name)+' <span class="muted">· '+new Date(x.submitted_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</span></div>').join(''):'<p class="muted">No members have voted yet.</p>';
  }catch(e){
    $('results').innerHTML='<p class="msg">'+esc(e.message)+'</p>';
  }
}
async function verify(){
  try{
    const j=await api('/ulam-voting/api/results');
    $('loginBox').hidden=true;$('resultsBox').hidden=false;loadResults();
  }catch(e){
    if(adminToken){sessionStorage.removeItem('ulam_admin_token');adminToken='';}
    try{
      const pin=$('pin').value.trim();if(!pin)return showMsg('Enter the admin PIN.');
      const j=await api('/ulam-voting/api/admin/login',{method:'POST',body:JSON.stringify({pin})});
      adminToken=j.token;sessionStorage.setItem('ulam_admin_token',adminToken);
      $('loginBox').hidden=true;$('resultsBox').hidden=false;loadResults();
    }catch(err){showMsg(err.message)}
  }
}
$('login').onclick=verify;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')verify()});$('refresh').onclick=loadResults;
verify();setInterval(()=>{if(!$('resultsBox').hidden)loadResults()},1000);
</script>
</body>
</html>
