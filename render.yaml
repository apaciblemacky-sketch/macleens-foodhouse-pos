services:
  - type: web
    # Keep the existing Render service name to avoid accidentally provisioning a second service.
    name: macleens-foodhouse-pos
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MARKETING_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MARKETING_MODEL
        value: gpt-5.5
      - key: MARKETING_CRON_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://macleens-foodhouse-pos.onrender.com
      - key: META_GRAPH_VERSION
        value: v24.0
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_MARKETING_PROVIDER_WEBHOOK_URL
        sync: false
      - key: META_MARKETING_PROVIDER_TOKEN
        sync: false
