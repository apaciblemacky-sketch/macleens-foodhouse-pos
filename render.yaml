services:
  - type: web
    # Keep the existing Render service name to avoid accidentally provisioning a second service.
    name: macleens-foodhouse-pos
    env: python
    buildCommand: pip install -r requirements.txt
    # One worker is safe with the bundled/local SQLite fallback. The threads
    # handle short concurrent requests without duplicating scheduled work.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Recommended for production persistence: paste the internal
      # connection URL from a managed PostgreSQL database. Never commit it.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MARKETING_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_MARKETING_MODEL
        value: gpt-5.5
      - key: MARKETING_CRON_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://macleens-foodhouse-pos.onrender.com
      # Optional browser push for installed-app announcements. Generate a VAPID
      # key pair; never place the private key in source control.
      - key: WEBPUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEBPUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEBPUSH_VAPID_SUBJECT
        sync: false
