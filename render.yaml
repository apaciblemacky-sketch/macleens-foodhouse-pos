services:
  - type: web
    # Keep the existing Render service name to avoid accidentally provisioning a second service.
    name: macleens-foodhouse-pos
    env: python
    buildCommand: pip install -r requirements.txt
    # One worker is safe with the bundled/local SQLite fallback. The threads
    # handle short concurrent requests without duplicating scheduled work.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Strongly recommended before public Community growth: paste the internal
      # connection URL from a managed PostgreSQL database. Never commit it.
      - key: DATABASE_URL
        sync: false
      - key: COMMUNITY_REGISTRATION_OPEN
        value: "true"
      - key: COMMUNITY_POSTING_OPEN
        value: "true"
      - key: COMMUNITY_GROUP_WORKSPACES_OPEN
        value: "true"
      - key: COMMUNITY_INTERNAL_CHAT_OPEN
        value: "false"
      - key: COMMUNITY_SOCIAL_REWARDS_OPEN
        value: "false"
      - key: COMMUNITY_GIFTING_OPEN
        value: "false"
      - key: COMMUNITY_RESHARING_OPEN
        value: "false"
      - key: COMMUNITY_TRUSTED_POST_THRESHOLD
        value: "3"
      - key: COMMUNITY_MAX_OWNED_GROUPS
        value: "2"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MARKETING_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MARKETING_MODEL
        value: gpt-5.5
      - key: MARKETING_CRON_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://macleens-foodhouse-pos.onrender.com
      - key: META_GRAPH_VERSION
        value: v24.0
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_MARKETING_PROVIDER_WEBHOOK_URL
        sync: false
      - key: META_MARKETING_PROVIDER_TOKEN
        sync: false
      # Optional browser push for consented Community members. Generate a VAPID
      # key pair; never place the private key in source control.
      - key: WEBPUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEBPUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEBPUSH_VAPID_SUBJECT
        sync: false
